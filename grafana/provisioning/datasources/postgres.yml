apiVersion: 1
datasources:
  - name: TokenWarden DB
    uid: tw-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: tokenwarden
    isDefault: true
    jsonData:
      database: tokenwarden
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
