# TokenWarden demo: AI spend per team, with fake data.
#   docker compose up -d          -> Postgres (seeded) + Grafana on http://localhost:3000
#   docker compose --profile gateway up -d   -> also starts the LiteLLM gateway (needs real provider keys in .env)
name: tokenwarden

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tokenwarden
      POSTGRES_USER: tokenwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/02-risk.sql:/docker-entrypoint-initdb.d/02-risk.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenwarden -d tokenwarden"]
      interval: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-spend.json
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://alert-sink:8080/tokenwarden}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  # Demo receiver for budget alerts: watch them arrive with `docker compose logs -f alert-sink`
  alert-sink:
    image: mendhak/http-https-echo:latest
    environment:
      HTTP_PORT: 8080

  # Read-only usage/cost collectors (Phase 1). Runs hourly.
  #   docker compose --profile collectors up -d collector
  #   one-off test without keys: docker compose run --rm collector --mock
  collector:
    profiles: ["collectors"]
    build: ./collectors
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--loop", "3600"]
    environment:
      DATABASE_URL: postgresql://tokenwarden:${POSTGRES_PASSWORD:-demo-only-change-me}@postgres:5432/tokenwarden
      TEAMS_FILE: /config/teams.yaml
      ANTHROPIC_ADMIN_KEY: ${ANTHROPIC_ADMIN_KEY:-}
      OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    volumes:
      - ./collectors:/config:ro

  # AI risk scanner (Phase 1). Scans a folder of client repos, read-only.
  #   SCAN_DIR=/path/to/repos docker compose run --rm scanner --name "Client X" --db
  #   docker compose run --rm scanner --demo --db        (generated vulnerable demo repo)
  scanner:
    profiles: ["scanner"]
    build: ./scanner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokenwarden:${POSTGRES_PASSWORD:-demo-only-change-me}@postgres:5432/tokenwarden
    volumes:
      - ${SCAN_DIR:-./scanner/empty}:/scan:ro

  # PDF "AI Cost & Risk Snapshot" report -> ./reports
  #   docker compose run --rm report --client "Acme BV"
  report:
    profiles: ["report"]
    build: ./report
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokenwarden:${POSTGRES_PASSWORD:-demo-only-change-me}@postgres:5432/tokenwarden
    volumes:
      - ./reports:/reports

  # Optional: the real gateway clients would use in Phase 2.
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-demo-master-change-me}
      DATABASE_URL: postgresql://tokenwarden:${POSTGRES_PASSWORD:-demo-only-change-me}@postgres:5432/litellm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  pgdata:
